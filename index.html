<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VŠE Hub">
<meta name="theme-color" content="#0B2F6E">
<title>Study Hub · student prototype</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Navy sidebar on Mac/iPad, bottom tab bar on iPhone; calm white cards on a blue-tinted ground. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EEF2F9; --line:#DDE4EF;
  --ink:#0B1B36; --ink-2:#44546F; --ink-3:#55657F;
  --blue:#0B3D91; --blue-2:#1E5BC6; --blue-soft:#E3ECFB; --on-blue:#FFFFFF;
  --side-bg:#0B2F6E; --side-ink:#E4ECFA; --side-ink-2:#B9C9E6; --side-hover:rgba(255,255,255,.08); --side-active:rgba(255,255,255,.14);
  --red:#C2322F; --red-soft:#FBE7E6; --amber:#8C5A0E; --amber-soft:#FBF0DA; --green:#256B42; --green-soft:#E1F2E7;
  --c-om:#1E5BC6; --c-stats:#0F8292; --c-micro:#6650C9; --c-mkt:#B0457A; --c-is:#556683;
  --shadow:0 1px 2px rgba(11,27,54,.05),0 6px 20px rgba(11,27,54,.05);
  --overlay:rgba(8,20,45,.42);
  --f-display:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --surface:#111C31; --surface-2:#17243D; --line:#24344F;
  --ink:#E7EDF8; --ink-2:#B3BFD4; --ink-3:#8E9CB6;
  --blue:#7AA8F7; --blue-2:#94BAFA; --blue-soft:#172B4D; --on-blue:#0A1222;
  --side-bg:#0C1830; --side-ink:#E4ECFA; --side-ink-2:#8396B8; --side-hover:rgba(255,255,255,.06); --side-active:rgba(122,168,247,.16);
  --red:#F2857D; --red-soft:#3A1C1E; --amber:#E8BA62; --amber-soft:#382B14; --green:#74CC96; --green-soft:#15301F;
  --c-om:#7AA8F7; --c-stats:#4FC2CF; --c-micro:#A99BF2; --c-mkt:#E98DB8; --c-is:#A0AFCB;
  --shadow:none; --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1222; --surface:#111C31; --surface-2:#17243D; --line:#24344F;
  --ink:#E7EDF8; --ink-2:#B3BFD4; --ink-3:#8E9CB6;
  --blue:#7AA8F7; --blue-2:#94BAFA; --blue-soft:#172B4D; --on-blue:#0A1222;
  --side-bg:#0C1830; --side-ink:#E4ECFA; --side-ink-2:#8396B8; --side-hover:rgba(255,255,255,.06); --side-active:rgba(122,168,247,.16);
  --red:#F2857D; --red-soft:#3A1C1E; --amber:#E8BA62; --amber-soft:#382B14; --green:#74CC96; --green-soft:#15301F;
  --c-om:#7AA8F7; --c-stats:#4FC2CF; --c-micro:#A99BF2; --c-mkt:#E98DB8; --c-is:#A0AFCB;
  --shadow:none; --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.2;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
a{color:var(--blue-2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.84rem}
.eyebrow{font-size:0.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side-bg);color:var(--side-ink);
  padding-block:18px 0;padding-right:14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{min-width:52px;height:44px;padding:0 8px;border-radius:11px;flex:none;background:var(--side-ink);color:var(--side-bg);display:grid;place-items:center;font:700 .95rem/1 var(--f-display);letter-spacing:-.02em}
.brand b{display:block;font:700 1rem/1.2 var(--f-display)}
.brand span{display:block;font-size:0.8125rem;line-height:1.3;color:var(--side-ink-2);margin-top:2px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:0.8125rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink-2);padding:0 10px 4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:10px;border:0;background:none;color:var(--side-ink);cursor:pointer;text-align:left;font-size:.875rem}
.nav-item:hover{background:var(--side-hover)}
.nav-item[aria-current="page"]{background:var(--side-active);font-weight:600}
.nav-item .count{margin-left:auto;font:500 0.8125rem/1 var(--f-mono);background:var(--red);color:#fff;border-radius:99px;padding:4px 7px}
.side-foot{margin-top:auto;position:sticky;bottom:0;background:var(--side-bg);padding:10px 0 14px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:10px}
.profile{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;border:0;background:none;color:var(--side-ink-2);font-size:0.8125rem;text-align:left;cursor:pointer}
.profile:hover,.profile[aria-current="page"]{background:var(--side-hover)}
.profile .gear{margin-left:auto;width:18px;height:18px}
.proto-note{font-size:0.8125rem;color:var(--side-ink-2);padding:0 10px;line-height:1.4}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--side-active);display:grid;place-items:center;font-weight:600;color:var(--side-ink);flex:none}

main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
@supports (backdrop-filter:blur(1px)){.topbar{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.topbar .mobile-brand{display:none;align-items:center;gap:10px;font:700 1rem var(--f-display)}
.topbar .mobile-brand .logo{width:30px;height:30px;font-size:0.8125rem;background:var(--blue);color:var(--on-blue);border-radius:8px}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px 0 38px;font:inherit;font-size:.9375rem}
.search input::placeholder{color:var(--ink-3)}
.search .i{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(11,27,54,.18);padding:6px;max-height:60vh;overflow:auto;z-index:20}
.results button{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .k{font-size:0.8125rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);width:74px;flex:none}
.results .none{padding:12px;color:var(--ink-2);font-size:.9375rem}
.top-actions{margin-left:auto;display:flex;gap:8px}
.content{width:100%;max-width:none;padding-block:28px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink-3);font-size:0.8125rem;font-weight:500;padding:4px 0;cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tabbar .dot{position:absolute;top:2px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}

@media (max-width:767px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabbar{display:flex}
  .topbar .mobile-brand{display:flex}
  .content{padding-bottom:110px}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:560px){ .top-actions .btn-label{display:none} .topbar .mobile-brand span{display:none} h1{font-size:1.45rem} }

/* building blocks */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-head .lede{color:var(--ink-2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head a,.link{font-size:.86rem;font-weight:500;color:var(--blue-2);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:1060px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.875rem;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:32px;padding:0 11px;font-size:.82rem}
.btn .i{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:0.8125rem;font-weight:600;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.grey{background:var(--surface-2);color:var(--ink-2)}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.cdot{width:10px;height:10px;border-radius:3px;background:var(--cc);flex:none;display:inline-block}
.course-chip{display:inline-flex;align-items:center;gap:6px;font-size:0.8125rem;font-weight:600;color:var(--ink-2)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9375rem}
.notice .i{color:var(--blue);margin-top:1px}

/* today */
.next{position:relative;overflow:hidden}
.next .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.next h2{font-size:1.45rem}
.next .topic{margin-top:6px;color:var(--ink-2)}
.next .topic b{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0;padding:14px 0;border-block:1px solid var(--line)}
.facts dt{font-size:0.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:.95rem}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.timeline{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:12px;align-items:stretch;border:0;background:none;text-align:left;padding:0;cursor:pointer;color:inherit}
.tl-time{font:500 .82rem/1.3 var(--f-mono);color:var(--ink-2);padding-top:12px;text-align:right}
.tl-rail{position:relative}
.tl-rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-rail::after{content:"";position:absolute;left:1px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--cc)}
.tl-row:first-child .tl-rail::before{top:16px}
.tl-row:last-child .tl-rail::before{bottom:calc(100% - 22px)}
.tl-body{padding:10px 12px;margin:2px 0;border-radius:10px;min-width:0}
.tl-row:hover .tl-body{background:var(--surface-2)}
.tl-body .t{font-weight:600}
.tl-body .s{font-size:.875rem;color:var(--ink-2)}
.tl-row.past{opacity:.55}
.tl-row.off .t{text-decoration:line-through}
.empty{padding:18px;text-align:center;color:var(--ink-2);font-size:.9rem;background:var(--surface-2);border-radius:10px}
.topics{display:flex;flex-direction:column}
.topic-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:inherit;width:100%}
.topic-row:first-child{border-top:0;padding-top:2px}
.topic-row .n{font-size:0.8125rem;color:var(--ink-3)}
.topic-row .name{font-weight:600}
.topic-row .i{color:var(--ink-3);width:18px}
.task-mini{display:flex;flex-direction:column;gap:10px}
.tm{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);border:0;text-align:left;cursor:pointer;color:inherit;width:100%}
.tm .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--uc)}
.tm .t{font-weight:600;font-size:.9375rem}
.tm .s{font-size:.875rem;color:var(--ink-2)}
.news{display:flex;flex-direction:column;gap:14px}
.news article{display:flex;flex-direction:column;gap:3px}
.news .meta{font-size:0.8125rem;color:var(--ink-3)}
.news p{font-size:.9375rem}
.menu{display:flex;flex-direction:column;gap:8px}
.menu div{display:flex;justify-content:space-between;gap:12px;font-size:.9375rem}
.menu .price{font-family:var(--f-mono);color:var(--ink-2);white-space:nowrap}

/* calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cal-nav{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
/* calendar */
.cal-wrap{overflow-x:auto;padding:0}
.cal-head{align-items:center}
.cal-head h1{font-size:1.5rem}
.cal-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.cal-nav .btn[aria-pressed="true"]{background:var(--surface-2);font-weight:600}
.traffic i.tl-sw{width:14px;height:14px;border-radius:4px;background:var(--uc-soft);box-shadow:inset 4px 0 0 var(--uc);display:inline-block}
.cal{--calh:520px;display:grid;grid-template-columns:62px repeat(5,minmax(130px,1fr));min-width:720px}
.cal-h .cal-m{font-size:0.8125rem;color:var(--ink-2)}
.cal-gut{position:relative;height:var(--calh)}
.cal-gut span{position:absolute;right:8px;transform:translateY(-50%);font:500 0.8125rem var(--f-mono);color:var(--ink-2)}
.cal-gut span:first-child{transform:none}
.cal-col{position:relative;height:var(--calh);border-left:1px solid var(--line)}
.due-tile{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;border:0;text-align:left;cursor:pointer;background:var(--uc-soft);box-shadow:inset 4px 0 0 var(--uc);color:var(--ink);min-width:0}
.due-tile:hover{filter:brightness(.97)}
.due-tile .dt-top{display:flex;align-items:center;gap:6px;font:600 0.8125rem var(--f-mono);color:var(--uc)}
.due-tile .dt-dot{width:8px;height:8px;border-radius:50%;background:var(--uc);flex:none}
.due-tile .dt-t{font-size:0.875rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.due-tile .dt-top{flex:none}
.cal.compact .ev .p{display:none}
.cal:not(.compact) .due-tile{flex-direction:column;align-items:flex-start;gap:1px}
.cal:not(.compact) .due-tile .dt-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal-legend b{font-weight:600;color:var(--ink)}
.cal-legend .traffic{display:inline-flex;gap:14px}
.cal-legend .sep{width:1px;height:16px;background:var(--line)}
/* settings + add to calendar */
.cal-opts{display:flex;flex-direction:column;gap:8px}
.cal-opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cal-opt .t{font-weight:600}
.cal-opt .s{font-size:0.875rem;color:var(--ink-2)}
.cal-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.cal-apple{background:#1F2937}.cal-google{background:#1A73E8}.cal-outlook{background:#0F6CBD}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-size:.9375rem}
.radio .s{display:block;font-size:0.875rem;color:var(--ink-2);margin-top:2px}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;margin-top:2px}
.radio[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.radio[aria-checked="true"] .dot{border:6px solid var(--blue)}
.avatar.lg{width:48px;height:48px;font-size:1rem;background:var(--blue-soft);color:var(--blue)}
.cal-h{padding:10px 10px;border-bottom:1px solid var(--line);font-size:.875rem;color:var(--ink-2);display:flex;gap:6px;align-items:baseline}
.cal-h b{font:600 1.1rem var(--f-display);color:var(--ink)}
.cal-h.today b{background:var(--blue);color:var(--on-blue);border-radius:8px;padding:0 7px}
.cal-allday{grid-column:span 1;border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:44px;min-width:0;border-left:1px solid var(--line)}
.cal-allday.gut{border-left:0;font-size:0.8125rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding-top:10px}
.due-chip{font-size:0.8125rem;padding:3px 7px;border-radius:6px;border:0;text-align:left;cursor:pointer;background:var(--uc-soft);color:var(--uc);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hol-chip{font-size:0.8125rem;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.cal-col .line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cal-col.today{background:color-mix(in srgb,var(--blue-soft) 45%,transparent)}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 9px 5px 11px;overflow:hidden;cursor:pointer;text-align:left;border:0;
  background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--ink);box-shadow:inset 4px 0 0 var(--cc);display:flex;flex-direction:column;gap:1px;min-height:0}
.ev:hover{background:color-mix(in srgb,var(--cc) 22%,var(--surface))}
.ev .t{font-size:.9375rem;font-weight:700;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r{font:500 0.8125rem/1.35 var(--f-mono);color:var(--ink)}
.ev .p{font-size:0.875rem;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.off{background:var(--surface-2);box-shadow:none;opacity:.7}
.ev.off .t{color:var(--ink-2);text-decoration:line-through}
.agenda{display:none;flex-direction:column;gap:14px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:0.8125rem;color:var(--ink-2)}
.days button b{font:600 1.05rem var(--f-display);color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.days button[aria-pressed="true"] b{color:var(--on-blue)}
.days button.has::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:3px;opacity:.6}
.ag-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;width:100%;color:inherit;box-shadow:inset 4px 0 0 var(--cc)}
.ag-item .tm2{font:500 0.8125rem/1.35 var(--f-mono);color:var(--ink-2)}
.ag-item .t{font-weight:700;color:var(--cc);font-size:.9rem}
.ag-item .r{font-size:.9375rem}
.ag-item .p{font-size:.875rem;color:var(--ink-2)}
.ag-item.off{opacity:.6}
.ag-item.off .t{text-decoration:line-through}
@media (max-width:767px){.cal-card{display:none}.agenda{display:flex}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:0.8125rem;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* courses */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.course-card{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.course-card:hover{border-color:color-mix(in srgb,var(--cc) 55%,var(--line))}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:500 0.8125rem var(--f-mono);color:var(--ink-3)}
.course-card h3{font-size:1.08rem}
.course-card .who{font-size:.9375rem;color:var(--ink-2)}
.wk{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9375rem}
.wk .eyebrow{font-size:0.8125rem;margin-bottom:2px}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cc,var(--blue));border-radius:99px}
.cc-foot{display:flex;justify-content:space-between;font-size:.875rem;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.course-head{display:flex;flex-direction:column;gap:12px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:.86rem;color:var(--blue-2);border:0;background:none;cursor:pointer;padding:0;width:max-content}
.back .i{width:16px;height:16px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9375rem;color:var(--ink-2)}
.meta-row span{display:inline-flex;gap:6px;align-items:center}
.meta-row .i{width:16px;height:16px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-size:.875rem;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue);font-weight:600}
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.week[open]{box-shadow:var(--shadow)}
.week.current{border-color:color-mix(in srgb,var(--cc) 55%,var(--line))}
.week summary{list-style:none;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.week summary::-webkit-details-marker{display:none}
.week summary .wn{font:500 0.8125rem var(--f-mono);color:var(--ink-3)}
.week summary .wt{font-weight:600}
.week summary .wd{font-size:.875rem;color:var(--ink-2)}
.week-body{padding:4px 16px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.week-body{grid-template-columns:minmax(0,1fr)} .week summary{grid-template-columns:54px minmax(0,1fr) auto}}
.week-body h4{margin:0 0 8px;font-size:0.8125rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:var(--surface-2);font-size:.9375rem;border:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.li:hover{background:color-mix(in srgb,var(--blue-soft) 70%,var(--surface-2))}
.li .i{width:17px;height:17px;color:var(--ink-3)}
.li .sub{margin-left:auto;font-size:.875rem;color:var(--ink-3);white-space:nowrap}
.li.static{cursor:default}
.li.static:hover{background:var(--surface-2)}

/* tasks */
.legend-card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.legend-card div{display:flex;gap:10px;align-items:flex-start;font-size:.875rem;color:var(--ink-2)}
.legend-card b{color:var(--ink);display:block;font-size:.9375rem}
@media (max-width:700px){.legend-card{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.875rem;cursor:pointer;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.task-group{display:flex;flex-direction:column;gap:10px}
.task-group > h3{display:flex;align-items:center;gap:8px;font-size:.92rem}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0;color:var(--on-blue)}
.check[aria-checked="true"]{background:var(--blue);border-color:var(--blue)}
.check .i{width:15px;height:15px;stroke-width:3}
.task .t{font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left;font-size:.96rem;color:var(--ink)}
.task .s{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.875rem;color:var(--ink-2);margin-top:4px;align-items:center}
.task .side-pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
@media (max-width:560px){.task{grid-template-columns:auto minmax(0,1fr)}.task .side-pills{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}}

/* organisation */
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.stats-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .v{font:700 1.7rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px}
.stat .v small{font-size:.9rem;color:var(--ink-3);font-weight:500}
.stat .s{font-size:.875rem;color:var(--ink-2);margin-top:4px}
.ects-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.ects-bar i{display:block;height:100%}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9375rem}
th{text-align:left;font-size:0.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font:700 .9rem var(--f-mono)}
.g1{background:var(--green-soft);color:var(--green)}
.g2{background:var(--blue-soft);color:var(--blue)}
.g3{background:var(--amber-soft);color:var(--amber)}
.g4{background:var(--red-soft);color:var(--red)}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:10px 0;align-items:start}
.step .b{width:12px;height:12px;border-radius:50%;margin-top:5px;margin-left:5px;border:2px solid var(--ink-3)}
.step.done .b{background:var(--green);border-color:var(--green)}
.step.now .b{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.step .t{font-weight:600;font-size:.9375rem}
.step .d{font-size:.875rem;color:var(--ink-2)}
.tree details{border-top:1px solid var(--line)}
.tree > details:first-child{border-top:0}
.tree summary{cursor:pointer;padding:11px 4px;font-weight:600;font-size:.92rem;display:flex;gap:8px;align-items:center;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s;flex:none}
.tree details[open] > summary::before{transform:rotate(45deg)}
.tree .inner{padding:0 0 10px 18px}
.tree .inner details summary{font-weight:500}
.subject{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:var(--surface-2);margin-bottom:6px}
.subject .t{font-size:.9375rem;font-weight:600}
.subject .s{font-size:.875rem;color:var(--ink-2)}
.exam-list{display:flex;flex-direction:column;gap:10px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:16px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.exam .t{font-weight:600;font-size:.9375rem}
.exam .s{font-size:.875rem;color:var(--ink-2)}
.cap{font-size:.875rem;color:var(--ink-2)}
.cap .progress{margin-top:4px;height:5px;background:var(--line)}
.exam.mine{background:var(--blue-soft)}
@media (max-width:640px){.exam{grid-template-columns:minmax(0,1fr) auto}.exam .cap{grid-column:1/-1;grid-row:2}}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doc{display:flex;flex-direction:column;gap:10px}
.doc .ico{width:40px;height:40px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.doc p{font-size:.9375rem;color:var(--ink-2);flex:1}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.contacts .c{font-size:.9375rem;display:flex;flex-direction:column;gap:2px}
.contacts .c span{user-select:all;font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2)}

/* more */
.more-list{display:flex;flex-direction:column;gap:8px}
.more-list button{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink)}
.more-list .ico{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.more-list .t{font-weight:600}
.more-list .s{font-size:.875rem;color:var(--ink-2)}
.more-list .chev{margin-left:auto;color:var(--ink-3)}

/* assistant */
.chat{display:flex;flex-direction:column;gap:12px;min-height:340px}
.msg{max-width:min(560px,88%);padding:11px 14px;border-radius:16px;font-size:.9375rem;line-height:1.5}
.msg.bot{background:var(--surface-2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--blue);color:var(--on-blue);border-bottom-right-radius:5px;align-self:flex-end}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .actions{margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.875rem;cursor:pointer;color:var(--ink-2)}
.chips button:hover{border-color:var(--blue-2);color:var(--blue)}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:grid;place-items:center;padding:20px}
.sheet{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet .facts{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-mono);border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:10px}
@media (max-width:640px){
  .overlay{place-items:end stretch;padding:0}
  .sheet{border-radius:18px 18px 0 0;width:100%;padding-bottom:max(22px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (max-width:767px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.demo-flag{font-size:0.8125rem;color:var(--ink-3)}
/* focus */
.switch{width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.timer{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.timer{grid-template-columns:minmax(0,1fr);justify-items:center}.timer .tctl{width:100%}}
.ring-wrap{position:relative;width:200px;height:200px;max-width:100%}
.ring{width:200px;height:200px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c .big{font:600 2.3rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ring-c .s{font-size:0.8125rem;color:var(--ink-2);margin-top:6px}
.tctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.tctl label,.flabel{font-size:0.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tctl input[type=range]{width:100%;accent-color:var(--blue)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:600 0.8125rem var(--f-display);color:var(--ink-2);flex:none}
.tile.more{background:none;border-style:dashed}
.tile.lg{width:40px;height:40px;border-radius:11px;font-size:0.8125rem}
.mode-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.mode-row:first-child{border-top:0;padding-top:0}
.mode-ico{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.mode-row.on .mode-ico{background:var(--blue);color:var(--on-blue)}
.mode-row .t{font-weight:600}
.mode-row .s{font-size:.9375rem;color:var(--ink-2);margin:2px 0 8px}
.mode-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:560px){.mode-row{grid-template-columns:40px minmax(0,1fr)}.mode-side{grid-column:2;align-items:flex-start}}
.app-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.app-pick button{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:.875rem;color:var(--ink)}
.app-pick button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.app-pick button[aria-pressed="true"] .tile{border-color:var(--red);color:var(--red)}
.limit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.limit:first-child{border-top:0}
.limit .t{font-size:.9375rem;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.limit .t span{font:500 0.8125rem var(--f-mono);color:var(--ink-2)}
.limit .progress{margin-top:6px}
.stepper{display:flex;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.active-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--blue);color:var(--on-blue);border-radius:var(--r);padding:14px 18px}
.active-banner .i{width:22px;height:22px}
.active-banner .btn{margin-left:auto;background:transparent;color:var(--on-blue);border-color:color-mix(in srgb,var(--on-blue) 45%,transparent)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .bar{fill:var(--blue-2);opacity:.55}
.chart .bar.today{fill:var(--blue);opacity:1}
.chart .hit:hover + .bar,.chart g:hover .bar{opacity:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--ink-2);font:500 12px var(--f-mono)}
.chart text.val{fill:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:0.8125rem;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpis div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font:700 1.25rem var(--f-display);font-variant-numeric:tabular-nums}
.kpis span{font-size:.875rem;color:var(--ink-2)}
.shield{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.shield .lock{width:64px;height:64px;border-radius:18px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center}
.shield .lock .i{width:30px;height:30px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit}

/* campus */
.space-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.space .row.between{flex-wrap:wrap;gap:8px}
.space{display:flex;flex-direction:column;gap:10px}
.space .where{font-size:.875rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}

function urgency(t){
  const daysLeft=(t.due-new Date())/864e5;
  if(daysLeft<0)return'red';
  const need=EFFORT[effortOf(t)].days;
  if(daysLeft<=need)return'red';
  if(daysLeft<=need*2.5)return'amber';
  return'green';
}

/* ===== CALENDAR EXPORT (.ics for Apple Calendar) ===== */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function fold(line){const enc=new TextEncoder();let out='',cur='',bytes=0;for(const ch of line){const b=enc.encode(ch).length;if(bytes+b>74){out+=cur+'\r\n ';cur='';bytes=1}cur+=ch;bytes+=b}return out+cur}
const icsLocal=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsUtc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const VTZ=['BEGIN:VTIMEZONE','TZID:Europe/Prague','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
function locationOf({room,place}){
  if(!room&&!place)return null;
  const b=place?BUILDINGS[place.b]:building(room);const label=place?place.label:room;
  return{b,label,text:`${label} – ${b.name}, VŠE, ${CAMPUS_ADDR}`};
}
function vevent(ev){
  const {uid,start,end,title,desc,alarmMin}=ev;
  const L=['BEGIN:VEVENT',`UID:${uid}@study-hub.example`,`DTSTAMP:${icsUtc(new Date())}`,
    `DTSTART;TZID=Europe/Prague:${icsLocal(start)}`,`DTEND;TZID=Europe/Prague:${icsLocal(end)}`,`SUMMARY:${icsEsc(title)}`];
  const loc=locationOf(ev);
  if(loc)L.push(`LOCATION:${icsEsc(loc.text)}`,`GEO:${loc.b.lat};${loc.b.lon}`);
  if(desc)L.push(`DESCRIPTION:${icsEsc(desc)}`);
  if(alarmMin!=null)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,`TRIGGER:-PT${alarmMin}M`,'END:VALARM');
  L.push('END:VEVENT');return L;
}
const sessionArgs=s=>{const c=s.course;return{uid:s.id,start:s.start,end:s.end,room:s.room,alarmMin:15,
  title:`${c.short} ${s.type}: ${s.topic}`,
  desc:`${c.name} (${c.code}) · ${s.type}\nWeek ${s.week}: ${s.topic}${s.note?'\nNote: '+s.note:''}\n${s.type==='Lecture'?'Lecturer':'Tutor'}: ${s.teacher}\nRoom: ${s.room}, ${building(s.room).name}`}};
const taskArgs=t=>{const c=C[t.course];return{uid:'task-'+t.id,start:new Date(t.due.getTime()-30*6e4),end:t.due,alarmMin:24*60,
  title:`Due: ${t.title} (${c.short})`,desc:`${c.name} · ${t.kind}\nEstimated effort: ${fmtH(hoursOf(t))}\n${t.desc}`}};
const examArgs=x=>{const c=C[x.course];return{uid:'exam-'+x.id,start:x.date,end:new Date(x.date.getTime()+90*6e4),room:x.room,alarmMin:24*60,
  title:`Exam: ${c.name}`,desc:`${c.name} (${c.code}) · ${x.kind} exam\nBring your ISIC card.`}};
const sessionEvent=s=>vevent(sessionArgs(s)),taskEvent=t=>vevent(taskArgs(t)),examEvent=x=>vevent(examArgs(x));
function googleUrl(ev){
  const loc=locationOf(ev);
  const q=new URLSearchParams({action:'TEMPLATE',text:ev.title,dates:`${icsUtc(ev.start)}/${icsUtc(ev.end)}`,details:ev.desc||'',ctz:'Europe/Prague'});
  if(loc)q.set('location',loc.text);
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function buildICS(lines,name){
  const all=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VSE Study Hub//Prototype//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${icsEsc(name)}`,'X-WR-TIMEZONE:Europe/Prague',...VTZ,...lines,'END:VCALENDAR'];
  return all.map(fold).join('\r\n')+'\r\n';
}
function semesterICS(){
  const lines=[];
  SESSIONS.filter(s=>!s.cancelled).forEach(s=>lines.push(...sessionEvent(s)));
  TASKS.filter(t=>!state.done.has(t.id)).forEach(t=>lines.push(...taskEvent(t)));
  EXAMS.filter(x=>state.exams.has(x.id)).forEach(x=>lines.push(...examEvent(x)));
  if(globalThis.__extraICS)lines.push(...globalThis.__extraICS());
  return buildICS(lines,`VŠE · ${SEMESTER_LABEL}`);
}

const PROVIDERS={apple:{name:'Apple Calendar',how:'Downloads an .ics file. Open it to add the events.'},
  google:{name:'Google Calendar',how:'Opens Google Calendar in a new browser tab.'},
  outlook:{name:'Outlook',how:'Downloads an .ics file for Outlook (desktop or web).'}};

function calItem(kind,id){
  if(kind==='all')return{what:'Whole semester',sub:`${SEMESTER_LABEL}: all classes, open deadlines and your exams`,file:'study-hub-semester.ics',ics:()=>semesterICS()};

function calSheet(kind,id){
  const it=calItem(kind,id);if(!it)return;calPending=it;
  const auto=settings.sync==='auto'&&Object.values(settings.cal).some(Boolean);
  const conn=Object.keys(settings.cal).filter(k=>settings.cal[k]).map(k=>PROVIDERS[k].name);
  const opt=(k,inner)=>`<div class="cal-opt"><span class="cal-logo cal-${k}">${icon('calendar')}</span><div style="min-width:0;flex:1"><div class="t">${PROVIDERS[k].name}${settings.cal[k]?' <span class="pill green" style="margin-left:4px">Connected</span>':''}</div><div class="s">${it.ev||k!=='google'?PROVIDERS[k].how:'Downloads an .ics file. Then import it in Google Calendar.'}</div></div>${inner}</div>`;
  openSheet(`<div class="sheet-head"><div><p class="eyebrow">Add to calendar</p><h2 id="sheet-title">${e(it.what)}</h2><p class="small muted" style="margin-top:4px">${e(it.sub)}</p></div>${sheetClose}</div>
   ${auto?`<div class="notice">${icon('tick')}<span>Automatic sync is on, so this is already in ${e(conn.join(' and '))}. You can still add it to another calendar.</span></div>`:''}
   <div class="cal-opts">
    ${opt('apple',`<button class="btn sm primary" data-calgo="apple">${icon('download')}Download</button>`)}
    ${opt('google',it.ev?`<a class="btn sm primary" href="${e(googleUrl(it.ev))}" target="_blank" rel="noopener" data-calgoogle>${icon('ext')}Open</a>`:`<span class="actions" style="flex-wrap:nowrap"><button class="btn sm primary" data-calgo="google">${icon('download')}Download</button><a class="btn sm" href="https://calendar.google.com/calendar/r/settings/export" target="_blank" rel="noopener">${icon('ext')}Import page</a></span>`)}
    ${opt('outlook',`<button class="btn sm primary" data-calgo="outlook">${icon('download')}Download</button>`)}
   </div>
   <p class="small muted">Want this to happen automatically? <button class="link" data-go="settings">Calendar sync settings</button></p>`);
}
function downloadICS(provider){
  const it=calPending;if(!it)return;
  const text=it.ics?it.ics():buildICS(vevent(it.ev),'Study Hub');
  const name=PROVIDERS[provider].name;
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));
    const a=document.createElement('a');a.href=url;a.download=it.file;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    closeSheet();toast(provider==='google'?`${it.file} downloaded. Import it in Google Calendar (Settings → Import).`:`${it.file} downloaded. Open it to add it to ${name}.`);
  }catch(_){
    renderSheet(`<div class="sheet-head"><div><p class="eyebrow">${e(name)}</p><h2 id="sheet-title">Save the calendar file</h2></div>${sheetClose}</div>
     <p class="small muted">Your browser did not start the download. Copy the text below and save it as <span class="mono">${e(it.file)}</span>.</p>
     <textarea id="ics-text" readonly>${e(text)}</textarea><div class="actions"><button class="btn primary" data-copy-ics>Copy</button></div>`);
  }
}

/* --- Calendar --- */
// Mon–Fri, 08:00–18:00. Events are placed in % so the whole week fits the window height.
const DAY0=8*60,DAY1=18*60,SPAN=DAY1-DAY0;
const minOf=d=>d.getHours()*60+d.getMinutes();
const pct=m=>((Math.min(DAY1,Math.max(DAY0,m))-DAY0)/SPAN*100);
function calendar(){
  const now=new Date();
  // Mon–Fri week view: on Saturday and Sunday "this week" is the coming school week.
  const base=dow(now)>=6?addDays(mondayOf(now),7):mondayOf(now);
  const mon=addDays(base,state.calOffset*7);
  const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  const wk=weekOf(mon);
  if(state.calDay==null||!days.some(d=>iso(d)===state.calDay)){const t=days.find(d=>sameDay(d,now));state.calDay=iso(t||days[0])}
  const hours=[];for(let m=DAY0;m<DAY1;m+=60)hours.push(m);
  const dueOn=d=>TASKS.filter(t=>!state.done.has(t.id)&&sameDay(t.due,d)).sort((a,b)=>a.due-b.due);
  const examsOn=d=>EXAMS.filter(x=>state.exams.has(x.id)&&sameDay(x.date,d));
  const conn=Object.keys(settings.cal).filter(k=>settings.cal[k]).map(k=>PROVIDERS[k].name);
  const synced=settings.sync==='auto'&&conn.length;
  let grid=`<div class="cal-h cal-corner"></div>${days.map(d=>`<div class="cal-h ${sameDay(d,now)?'today':''}">${e(d.toLocaleDateString('en-GB',{weekday:'short'}))} <b>${d.getDate()}</b><span class="cal-m">${e(d.toLocaleDateString('en-GB',{month:'short'}))}</span></div>`).join('')}`;
  grid+=`<div class="cal-allday gut">Due</div>${days.map(d=>{
    const late=bookings.filter(b=>b.date===iso(d)&&bookingTimes(b).start.getHours()*60>=DAY1);
    return`<div class="cal-allday">${HOLIDAYS[iso(d)]?`<span class="hol-chip">${e(HOLIDAYS[iso(d)])}</span>`:''}${dueOn(d).map(t=>{const u=urgency(t);return`<button class="due-tile" style="--uc:var(--${u});--uc-soft:var(--${u}-soft)" data-task="${t.id}" title="${e(URG[u].label)} · due ${fmtTime(t.due)}: ${e(t.title)}"><span class="dt-top"><span class="dt-dot"></span>${e(C[t.course].short)}</span><span class="dt-t">${e(t.title)}</span></button>`}).join('')}${late.map(b=>`<button class="hol-chip" data-go="library" style="border:0;cursor:pointer;text-align:left">${fmtTime(bookingTimes(b).start)} Study · ${e(SP[b.space].name)}</button>`).join('')}</div>`}).join('')}`;
  grid+=`<div class="cal-gut">${hours.map(m=>`<span style="top:${pct(m)}%">${hm(m)}</span>`).join('')}</div>`;
  grid+=days.map(d=>{
    const box=(m0,m1)=>`top:calc(${pct(m0)}% + 2px);height:calc(${pct(m1)-pct(m0)}% - 4px)`;
    const evs=sessionsOn(d).map(s=>`<button class="ev ${s.cancelled?'off':''}" style="--cc:${s.course.color};${box(minOf(s.start),minOf(s.end))}" data-session="${s.id}" title="${e(s.course.name)} · ${e(s.type)}"><span class="t">${e(s.course.short)} · ${e(s.type)}</span><span class="r">${fmtTime(s.start)} · ${e(s.room)}</span><span class="p">${s.cancelled?'Public holiday':e(s.topic)}</span></button>`).join('');
    const ex=examsOn(d).map(x=>`<button class="ev" style="--cc:var(--red);${box(minOf(x.date),minOf(x.date)+90)}" data-exam-info="${x.id}"><span class="t">Exam · ${e(C[x.course].short)}</span><span class="r">${fmtTime(x.date)} · ${e(x.room)}</span></button>`).join('');
    const bk=bookings.filter(b=>b.date===iso(d)).map(b=>{const t=bookingTimes(b);const m0=minOf(t.start),m1=minOf(t.start)+b.dur*60;if(m0>=DAY1)return'';return`<button class="ev" style="--cc:var(--green);${box(m0,m1)}" data-go="library"><span class="t">Study · ${e(SP[b.space].name)}</span><span class="r">${fmtTime(t.start)} · ${e(bookingLabel(b))}</span></button>`}).join('');
    const nl=sameDay(d,now)&&minOf(now)>DAY0&&minOf(now)<DAY1?`<div class="now-line" style="top:${pct(minOf(now))}%"></div>`:'';
    return`<div class="cal-col ${sameDay(d,now)?'today':''}">${hours.slice(1).map(m=>`<div class="line" style="top:${pct(m)}%"></div>`).join('')}${evs}${ex}${bk}${nl}</div>`}).join('');
  const sel=days.find(d=>iso(d)===state.calDay);
  const agItems=sessionsOn(sel);
  const agDue=dueOn(sel);
  const agenda=`<div class="days">${days.map(d=>`<button aria-pressed="${iso(d)===state.calDay}" data-calday="${iso(d)}" class="${sessionsOn(d).length||dueOn(d).length?'has':''}">${e(d.toLocaleDateString('en-GB',{weekday:'short'}))}<b>${d.getDate()}</b></button>`).join('')}</div>
    ${HOLIDAYS[iso(sel)]?`<div class="notice">${icon('info')}<span>${e(HOLIDAYS[iso(sel)])}: public holiday, no classes.</span></div>`:''}
    ${agDue.map(taskRow).join('')}
    ${agItems.length?agItems.map(s=>`<button class="ag-item ${s.cancelled?'off':''}" style="--cc:${s.course.color}" data-session="${s.id}"><div class="tm2">${fmtTime(s.start)}<br>${fmtTime(s.end)}</div><div style="min-width:0"><div class="t">${e(s.course.name)} · ${e(s.type)}</div><div class="r"><span class="mono">${e(s.room)}</span> · ${e(building(s.room).name)}</div><div class="p">${s.cancelled?'No class':'Week '+s.week+': '+e(s.topic)}</div></div></button>`).join(''):`<div class="empty">No classes on this day.</div>`}`;
  const traffic=`<span class="legend traffic" aria-label="Deadline colours">${['red','amber','green'].map(u=>`<span><i class="tl-sw" style="--uc:var(--${u});--uc-soft:var(--${u}-soft)"></i>${URG[u].label}</span>`).join('')}</span>`;
  return `<header class="page-head cal-head"><div><p class="eyebrow">${wk>=1&&wk<=WEEKS?`Teaching week ${wk} of ${WEEKS}`:'Outside teaching weeks'}${state.calOffset===0?' · this week':''}</p><h1>${e(days[0].getDate()+'.')}–${e(fmtDate(days[4]))}</h1></div>
    <div class="cal-bar"><div class="cal-nav"><button class="icon-btn" data-calnav="-1" aria-label="Previous week">${icon('left')}</button><button class="btn" data-calnav="0" ${state.calOffset===0?'aria-pressed="true"':''}>This week</button><button class="icon-btn" data-calnav="1" aria-label="Next week">${icon('right')}</button></div>
    ${synced?`<button class="btn" data-go="settings" title="Calendar sync settings">${icon('tick')}Synced with ${e(conn.join(' & '))}</button>`:`<button class="btn primary" data-ics="all">${icon('calendarplus')}Add whole semester</button>`}</div></header>
   <section class="card cal-card cal-wrap"><div class="cal" id="cal">${grid}</div></section>
   <div class="agenda">${agenda}</div>
   <div class="legend cal-legend"><b>Deadlines</b>${traffic}<span class="sep"></span>${COURSES.map(c=>`<span style="--cc:${c.color}"><span class="cdot"></span>${e(c.name)}</span>`).join('')}<span style="--cc:var(--red)"><span class="cdot"></span>Exam</span><span style="--cc:var(--green)"><span class="cdot"></span>Study booking</span></div>`;
}
// Size the week grid so Mon–Fri 08:00–18:00 fits in the window without scrolling.
function fitCal(){
  const cal=document.getElementById('cal');if(!cal)return;
  const measure=()=>{const col=cal.querySelector('.cal-col');const top=col.getBoundingClientRect().top+window.scrollY;
    const leg=document.querySelector('.cal-legend');const legH=leg?leg.getBoundingClientRect().height+22:0;
    return Math.max(340,Math.min(760,window.innerHeight-top-legH-16))};
  cal.classList.remove('compact');let h=measure();
  if(h<420){cal.classList.add('compact');h=measure()}
  cal.style.setProperty('--calh',h+'px');
}

// Suggested start date = deadline minus the days the effort needs.
const startBy=t=>sod(addDays(t.due,-EFFORT[effortOf(t)].days));
// v2 task row: title, course + due, effort and materials chips, 4-step progress bar. Same row on Today, Tasks, Calendar and Courses.
function progressInfo(id){const st=stepOf(id);const miss=st===3;
  return{st,miss,label:st===4?'Submitted':miss?'Not submitted yet':st===0?'Not started':STEPS[st-1],
    segs:[0,1,2,3].map(i=>i<st?'on':(i===3&&miss?'miss':'')) }}
function taskRow(t){
  const c=C[t.course];const p=progressInfo(t.id);const u=urgency(t);const done=p.st===4;
  const pill=done?'<span class="pill green">✓ Submitted</span>':`<span class="pill ${u}"><span class="d"></span>${t.due<new Date()?'Overdue':URG[u].label}</span>`;
  return`<button class="trow ${done?'done':''}" style="--uc:var(--${done?'green':u});--cc:${c.color}" data-task="${t.id}">
    <span class="bar"></span>
    <span class="trow-main"><span class="trow-top"><span class="t">${e(t.title)}</span>${pill}</span>
      <span class="s">${e(c.name)} · due ${e(fmtDay(t.due))}, ${fmtTime(t.due)}</span>
      <span class="chips2"><span class="chip2">${icon('clock')}Est. effort ${fmtH(hoursOf(t))}</span><span class="chip2">${icon('clip')}${t.files.length} material${t.files.length===1?'':'s'}</span></span>
      <span class="segs" aria-hidden="true">${p.segs.map(x=>`<i class="${x}"></i>`).join('')}</span>
      <span class="seg-label ${p.miss?'miss':''}"><span>${e(p.label)}</span><span>Step ${p.st} of 4</span></span></span></button>`;
}
function tasks(){
  const f=state.taskFilter,srt=state.taskSort,cf=state.taskCourse||'all';
  const list=TASKS.filter(t=>(cf==='all'||t.course===cf)&&(f==='all'||(f==='done'?state.done.has(t.id):!state.done.has(t.id))));
  const today=sod(new Date());const sun=addDays(mondayOf(today),6);
  const grp=(title,items,pill)=>items.length?`<div class="task-group"><h3>${pill||`<span>${e(title)}</span>`}<span class="muted small" style="font-weight:400">${items.length}</span></h3>${items.map(taskRow).join('')}</div>`:'';
  let groups='';
  if(f==='done'){groups=`<div class="task-group">${list.map(taskRow).join('')||'<div class="empty">Nothing done yet.</div>'}</div>`}
  else{
    const opn=list.filter(t=>!state.done.has(t.id));
    if(srt==='length'){
      groups=['long','medium','short'].map(k=>grp(`${EFFORT[k].label} · ${EFFORT[k].hint}`,opn.filter(t=>effortOf(t)===k).sort((a,b)=>startBy(a)-startBy(b)))).join('');
    }else{
      const by=x=>opn.filter(x).sort((a,b)=>startBy(a)-startBy(b)||a.due-b.due);
      groups=grp('Start today',by(t=>startBy(t)<=today))+grp('Start this week',by(t=>startBy(t)>today&&startBy(t)<=sun))+grp('Start later',by(t=>startBy(t)>sun));
    }
    if(f==='all'){const d=list.filter(t=>state.done.has(t.id));if(d.length)groups+=grp('Done',d)}
    if(!groups)groups=`<div class="empty">${cf==='all'?'All done. Nice work.':'No tasks for this course here.'}</div>`;
  }
  return `<header class="page-head"><div><p class="eyebrow">Colour shows how urgent it is</p><h1>Tasks</h1></div>
     <div class="row" style="flex-wrap:wrap;gap:16px"><div class="seg" role="group" aria-label="Group tasks">${[['start','By start date'],['length','By length']].map(x=>`<button aria-pressed="${srt===x[0]}" data-tsort="${x[0]}">${x[1]}</button>`).join('')}</div>
     <div class="filters">${[['open','Open'],['all','All'],['done','Done']].map(x=>`<button aria-pressed="${f===x[0]}" data-tfilter="${x[0]}">${x[1]}</button>`).join('')}</div></div></header>
   <div class="chipset subj" role="group" aria-label="Filter by course"><button aria-pressed="${cf==='all'}" data-tcourse="all">All courses</button>${COURSES.map(c=>`<button aria-pressed="${cf===c.id}" data-tcourse="${c.id}" style="--cc:${c.color}"><span class="cdot"></span>${e(c.name)}</button>`).join('')}</div>
   <section class="card legend-card">${['red','amber','green'].map(u=>`<div><span class="pill ${u}"><span class="d"></span></span><span><b>${URG[u].label}</b>${URG[u].hint}</span></div>`).join('')}</section>
   ${groups}`;
}

  for(const [a,b] of r){if(m>=toMin(a)&&m<toMin(b))return{known:true,open:true,until:b,left:toMin(b)-m}}

  }
  const lay=(row,y,h,door)=>{const slots=row.reduce((a,r)=>a+(r.span||1),0);let x=20;return row.map(r=>{const w=920*(r.span||1)/slots;const o={...r,x,y,w,h,dx:x+w/2,dy:door};x+=w;return o})};

const norm=s=>String(s).toUpperCase().replace(/[\s·.\-]/g,'');

  const want=alias[n]?norm(alias[n]):n;
  let best=null;
  for(const b of Object.keys(BLD_INFO))for(const f of BLD_INFO[b].floors){const p=plan(b,f);for(const it of [...p.top,...p.bot]){if(it.core)continue;const id=norm(it.id),lb=norm(it.label||'');

  return best;
}

function roomBusy(code,d,blk){
  if(!rangesOn(BUILDING_HOURS,d).length||dow(d)>5)return{closed:true};
  const mine=SESSIONS.find(s=>s.room===code&&sameDay(s.date,d)&&fmtTime(s.start)===BLOCKS[blk][0]&&!s.cancelled);
  if(mine)return{busy:true,mine:true,label:`${mine.course.short} ${mine.type.toLowerCase()}`};
  return hash(code+iso(d)+blk)%100<50?{busy:true,label:'Class'}:{};
}
function roomNow(code){
  const now=new Date();const st=openState(BUILDING_HOURS);if(!st.open)return{cls:'grey',text:'Building closed'};
  const m=minOf(now);const bk=Object.entries(BLOCKS);
  let cur=bk.find(([,v])=>m>=toMin(v[0])&&m<toMin(v[1]));
  if(cur&&roomBusy(code,now,cur[0]).busy)return{cls:'red',text:`In use until ${cur[1][1]}`};
  const nextBusy=bk.find(([k,v])=>toMin(v[0])>m&&roomBusy(code,now,k).busy);
  return{cls:'green',text:nextBusy?`Free until ${nextBusy[1][0]}`:`Free until ${st.until}`};
}

function bookSheet(fresh){
  const bk=state.book;const sp=SP[bk.space];const dates=bookDates(sp);
  if(!dates.includes(bk.date))bk.date=dates[0];
  let body='';
  if(!bk.date){body='<div class="empty">No opening hours in the next two weeks.</div>'}
  else{
    const starts=startOptions(sp,bk.date);if(!starts.includes(bk.start)){bk.start=starts[0];bk.unit=null}
    const maxDur=Math.min(3,Math.floor((closeAt(sp,bk.date,bk.start)-bk.start)/60));if(bk.dur>maxDur)bk.dur=maxDur;
    const units=sp.kind==='seat'?Array.from({length:sp.seats},(_,i)=>String(i+1)):sp.rooms;
    const st=u=>unitTaken(sp,bk.date,bk.start,bk.dur,u);
    let map;
    if(sp.kind==='seat'){const groups=[];for(let i=0;i<units.length;i+=sp.per)groups.push(units.slice(i,i+sp.per));
      map=`<div class="seatmap">${groups.map(g=>`<div class="table-grp ${sp.per===5?'w5':''}">${g.map(u=>{const s=st(u);return`<button class="seat ${s==='mine'?'mine':''}" ${s?'disabled':''} aria-pressed="${bk.unit===u}" data-seat="${u}" aria-label="Seat ${u}${s?' taken':''}">${u}</button>`}).join('')}</div>`).join('')}</div>`;}
    else map=`<div class="list">${units.map(u=>{const s=st(u);return`<button class="li" ${s?'disabled style="opacity:.5;cursor:not-allowed"':''} aria-pressed="${bk.unit===u}" data-seat="${e(u)}" ${bk.unit===u?'style="outline:2px solid var(--blue)"':''}>${icon('users')}<span>${e(u)}</span><span class="sub">${s==='mine'?'Your booking':s?'Taken':'Free'}</span></button>`}).join('')}</div>`;
    const free=units.filter(u=>!st(u)).length;
    body=`<div class="field"><span class="flabel">Day</span><div class="chipset">${dates.map(d=>`<button aria-pressed="${bk.date===d}" data-bdate="${d}">${sameDay(parseIso(d),new Date())?'Today':e(fmtDay(parseIso(d)))}</button>`).join('')}</div></div>
     <div class="field"><span class="flabel">From</span><div class="chipset">${starts.map(t=>`<button aria-pressed="${bk.start===t}" data-bstart="${t}">${hm(t)}</button>`).join('')}</div></div>
     <div class="field"><span class="flabel">For</span><div class="chipset">${[1,2,3].map(x=>`<button aria-pressed="${bk.dur===x}" data-bdur="${x}" ${x>maxDur?'disabled':''}>${x} h</button>`).join('')}</div></div>
     <div class="field"><span class="flabel">${sp.kind==='seat'?'Seat':'Room'} · ${free} of ${units.length} free, ${hm(bk.start)}–${hm(bk.start+bk.dur*60)}</span>${map}</div>
     <div class="actions"><button class="btn primary" data-bconfirm ${bk.unit?'':'disabled'}>${bk.unit?`Book ${sp.kind==='seat'?'seat '+e(bk.unit):e(bk.unit)}`:'Choose a '+(sp.kind==='seat'?'seat':'room')}</button></div>`;
  }
  const html=`<div class="sheet-head"><div><p class="eyebrow">${e(sp.where)}</p><h2 id="sheet-title">${e(sp.name)}</h2></div>${sheetClose}</div>${body}`;
  fresh?openSheet(html):renderSheet(html);
}

function mailMatches(m){
  const f=state.mailFilter||'all',q=(state.mailQ||'').trim().toLowerCase();
  if(f==='unread'&&m.read)return false;if(f==='flagged'&&!m.flagged)return false;if(f==='files'&&!m.file)return false;if(f==='lecturers'&&!LECTURERS().includes(m.from))return false;
  if(q&&!(m.subject+' '+m.from+' '+(m.to||'')+' '+m.body+' '+(m.course?C[m.course].name:'')).toLowerCase().includes(q))return false;
  return true;
}
function mailListHtml(){
  const fo=state.mailFolder||'inbox';const q=(state.mailQ||'').trim();
  const list=MBOX.filter(m=>(q?m.folder!=='trash':m.folder===fo)&&mailMatches(m)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const out=m=>m.folder==='sent'||m.folder==='drafts';
  const row=m=>{const unread=!m.read;const c=m.course&&C[m.course];
    return`<button class="mrow ${unread?'unread':''}" data-mail="${m.id}"><span class="udot" aria-label="${unread?'Unread':''}"></span><span class="mrow-main"><span class="mrow-top"><b class="who">${m.folder==='drafts'?'<span class="draft-tag">Draft</span> ':''}${e(out(m)?'To: '+m.to:m.from)}</b><span class="when">${m.flagged?`<span class="flag-on" aria-label="Flagged">${icon('flag')}</span>`:''}${m.file?icon('clip'):''}${e(mailWhen(m.date))}</span></span>

      <span class="subj">${e(m.subject)}</span><span class="prev">${e(m.body.replace(/\s+/g,' ').slice(0,110))}</span></span></button>`};
  return list.length?list.map(row).join(''):`<div class="empty">${q?`No mail matches “${e(q)}”.`:state.mailFilter&&state.mailFilter!=='all'?'No mail matches this filter.':`${e(folderName(fo))} is empty.`}</div>`;

/* --- Search --- */
function searchIndex(){
  const items=[];
  COURSES.forEach(c=>{items.push({k:'Course',l:c.name,s:c.code,a:{course:c.id}});c.topics.forEach((tp,i)=>items.push({k:'Topic',l:tp,s:`${c.short} · week ${i+1}`,a:{course:c.id}}));});
  TASKS.forEach(t=>items.push({k:'Task',l:t.title,s:`${C[t.course].short} · due ${fmtDay(t.due)}`,a:{task:t.id}}));
  [...new Set(COURSES.flatMap(c=>c.slots.map(s=>s.room)))].forEach(r=>{const s=SESSIONS.find(x=>x.room===r&&!x.cancelled&&x.end>new Date());items.push({k:'Room',l:`${r} · ${building(r).name}`,s:s?`next: ${s.course.short} ${fmtDay(s.date)} ${fmtTime(s.start)} · tap for route`:'tap for route',a:{nav:r}})});
  SPACES.forEach(x=>items.push({k:'Study',l:x.name,s:x.where,a:{book:x.kind==='insis'?'':x.id,go:x.kind==='insis'?'library':''}}));
  CANTEENS.slice(0,4).forEach(x=>items.push({k:'Canteen',l:x.name,s:x.where,a:{go:'cafeteria'}}));
  [['Focus','focus'],['Cafeteria','cafeteria'],['Menu','cafeteria'],['Library','library'],['Buildings','buildings'],['Free rooms','buildings'],['Indoor map','map'],['Exams','exams'],['Grades & credits','grades'],['Course registration','registration'],['Documents','documents'],['Confirmation of study','documents'],['Transcript of records','documents'],['Mail','mail'],['Inbox','mail'],['Study assistant','assistant'],['Calendar','calendar'],['Settings','settings'],['Calendar sync','settings']].forEach(p=>items.push({k:'Page',l:p[0],s:'',a:{go:p[1]}}));
  return items;
}

document.addEventListener('input',ev=>{if(ev.target.id==='mail-q'){state.mailQ=ev.target.value;const l=$('#mail-list');if(l)l.innerHTML=mailListHtml();const w=$('.mail-where');if(w)w.textContent=state.mailQ.trim()?'Search results in all folders':folderName(state.mailFolder||'inbox')}});
document.addEventListener('change',ev=>{if(ev.target.id==='mail-move'&&ev.target.value)moveMail(ev.target.dataset.id,ev.target.value)});
document.addEventListener('input',ev=>{
  if(ev.target.id==='fd-h'||ev.target.id==='fd-m'){
    const h=Math.max(0,Math.min(8,parseInt($('#fd-h').value||'0',10)||0)),mi=Math.max(0,Math.min(59,parseInt($('#fd-m').value||'0',10)||0));
    const m=h*60+mi;if(m<5)return;fdraft.min=m;
    $('#fd-time').textContent=fmtDur(m);$('#fd-end').textContent='ends '+fmtTime(new Date(Date.now()+m*6e4));
    const tm=ev.target.closest('.timer');tm.querySelector('.fg').setAttribute('stroke-dashoffset',CIRC*(1-Math.min(m,180)/180));
    tm.querySelectorAll('[data-fpreset]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.fpreset)===m));
  }
});
document.addEventListener('change',ev=>{if((ev.target.id==='fd-h'||ev.target.id==='fd-m')&&fdraft.min<5){fdraft.min=5;render()}});
document.addEventListener('mouseover',ev=>{const g=ev.target.closest('#fchart [data-tip]');const tip=$('#ftip');if(!tip)return;if(!g){tip.hidden=true;return}const box=$('#fchart').getBoundingClientRect(),r=g.querySelector('.bar').getBoundingClientRect();tip.textContent=g.dataset.tip;tip.style.left=(r.left-box.left+r.width/2)+'px';tip.style.top=(r.top-box.top)+'px';tip.hidden=false});
function logFocus(){if(!fses)return;const mins=Math.round((Math.min(Date.now(),fses.end)-fses.start)/6e4);const k=iso(new Date());const d=store.get('focusDone',{});d[k]=(d[k]||0)+mins;store.set('focusDone',d)}
function updateFocusLive(){
  const now=Date.now();
  if(fses&&now>=fses.end){logFocus();fses=null;saveF();toast('Focus session complete. Well done!');if(state.view==='focus'){render();return}}
  const af=activeFocus();const pill=$('#focus-pill');const sf=$('#side-focus');
  if(af){pill.hidden=false;pill.innerHTML=`${icon('shield')}${e(fcfg.modes[af.mode].name)}${fses&&now<fses.end?' · '+mmss((fses.end-now)/1000):''}`;sf.textContent=fses?mmss((fses.end-now)/1000):'On'}else{pill.hidden=true;sf.textContent=''}
  if(state.view==='focus'&&fses){const t=$('#ft-time'),ring=$('#ft-ring');if(t){const left=(fses.end-now)/1000,total=(fses.end-fses.start)/1000;t.textContent=mmss(left);ring.setAttribute('stroke-dashoffset',CIRC*(1-left/total));const sub=$('#ft-sub');const br=fses.breakUntil&&now<fses.breakUntil;sub.textContent=br?'Break · apps unlocked until '+fmtTime(new Date(fses.breakUntil)):'until '+fmtTime(new Date(fses.end))}}
}
setInterval(updateFocusLive,1000);

const VIEWS=['mail','today','calendar','courses','tasks','registration','exams','grades','documents','assistant','more','focus','cafeteria','library','buildings','map','settings'];
window.addEventListener('resize',()=>{if(state.view==='calendar')fitCal()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==state.view&&VIEWS.includes(v))go(v)});
const h=(location.hash||'').slice(1);
if(VIEWS.includes(h))state.view=h;
else if(h.startsWith('course-')&&C[h.slice(7)]){state.view='course';state.course=h.slice(7)}
render();
setInterval(()=>{if(state.view==='today'&&$('#overlay').hidden&&document.activeElement===document.body)render()},60000);
}
</script>
